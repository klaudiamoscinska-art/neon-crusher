name: KERNELFALL V3 - import full art pack
on:
  push:
    branches:
      - feature/kernelfall-art-v3-source
    paths:
      - 'assets/kernelfall-v3/_transfer/**'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Verify archive and unpack all art sources
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, shutil, zipfile
          root=pathlib.Path(".").resolve()
          transfer=root/"assets/kernelfall-v3/_transfer"
          parts=sorted(transfer.glob("part*.b64"))
          if len(parts)!=8:
              raise SystemExit(f"Expected 8 transfer parts, found {len(parts)}")
          source="".join("".join(p.read_text(encoding="ascii").split()) for p in parts)
          raw=base64.b64decode(source, validate=True)
          expected="77b263f53de0bc3754c607e91c24d32fa2793cabd8bf8cf1c7e46c1c65ca832d"
          digest=hashlib.sha256(raw).hexdigest()
          if digest!=expected:
              raise SystemExit(f"SHA mismatch: {digest} != {expected}")
          files=[]
          with zipfile.ZipFile(io.BytesIO(raw)) as zf:
              for member in zf.infolist():
                  if member.is_dir(): continue
                  source_path=pathlib.PurePosixPath(member.filename)
                  if source_path.is_absolute() or ".." in source_path.parts:
                      raise SystemExit("Unsafe zip path")
                  if member.filename.startswith("assets/kernelfall-v3/"):
                      target=root/member.filename
                  elif member.filename.startswith(("previews/","references/")) or member.filename in ("README.md","INTEGRATION_SPEC_PL.md","CLAUDE_PROMPT_PL.txt"):
                      target=root/"docs/art/kernelfall-v3"/member.filename
                  else:
                      raise SystemExit("Unexpected archive entry: "+member.filename)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(zf.read(member))
                  files.append(str(target.relative_to(root)))
          manifest_path=root/"assets/kernelfall-v3/manifest.json"
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          if len(manifest["files"])!=100: raise SystemExit("Expected 100 images")
          for entry in manifest["files"]:
              p=root/"assets/kernelfall-v3"/entry["path"]
              if not p.exists() or hashlib.sha256(p.read_bytes()).hexdigest()!=entry["sha256"]:
                  raise SystemExit("Asset mismatch: "+str(p))
          count=sum(1 for p in (root/"assets/kernelfall-v3").rglob("*.png"))
          if count!=100: raise SystemExit(f"Expected 100 PNGs, got {count}")
          shutil.rmtree(transfer)
          print("PASS: 100 PNGs, SHA-256 exact, full archive unpacked; files:",len(files))
          PY
      - name: Commit extracted art to feature branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/kernelfall-v3 docs/art/kernelfall-v3
          if ! git diff --cached --quiet; then
            git commit -m "art: unpack verified KERNELFALL V3 pack (100 PNGs)"
            git push origin HEAD:feature/kernelfall-art-v3-source
          fi
