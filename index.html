<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Crusher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="brand__housing" d="M7 1.5h10l5.5 5.5v10L17 22.5H7L1.5 17V7z"/><path class="brand__half" d="M10.6 5.2L5.6 12l5 6.8zM13.4 5.2l5 6.8-5 6.8z"/><path class="brand__light" d="M12 6.6q1.3 5.4 0 10.8q-1.3-5.4 0-10.8z"/></svg>NEON<span>CRUSHER</span></div>
      <div class="stats">
        <div class="stat stat--cash">
          <span class="stat-label" id="labelCash">Cash</span>
          <span class="stat-value" id="statCash">$0</span>
        </div>
        <div class="stat stat--level">
          <span class="stat-label" id="labelLevel">Level</span>
          <span class="stat-value" id="statLevel">1</span>
        </div>
        <button class="icon-btn" id="btnMute" type="button" aria-label="Sound on" aria-pressed="false" title="Sound on">&#9834;</button>
      </div>
    </header>

    <main id="gameArea">
      <canvas id="gameCanvas"></canvas>
      <p id="hint" class="hint" hidden>Hits pay cash · break the heart to shatter the core</p>
    </main>

    <footer id="shop">
      <button class="shop-btn" id="btnBuyBall" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="15" cy="12" r="4.5"/><path d="M2 9.5h6M3.5 12h5M2 14.5h6"/></svg>
        <span class="shop-btn__title" id="titleBuyBall">Buy new ball</span>
        <span class="shop-btn__desc" id="descBuyBall">Balls: 1</span>
        <span class="shop-btn__cost" id="costBuyBall">$10</span>
      </button>

      <button class="shop-btn" id="btnFireRate" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12l4-6.9h8L20 12l-4 6.9H8z"/><path d="M13 7.5l-3.2 5h4.4L11 17"/></svg>
        <span class="shop-btn__title" id="titleFireRate">Volley charge</span>
        <span class="shop-btn__desc" id="descFireRate">Lvl 1 · 11 s</span>
        <span class="shop-btn__cost" id="costFireRate">$15</span>
      </button>

      <button class="shop-btn" id="btnDamage" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/><path d="M12 9l3 3-3 3-3-3z"/></svg>
        <span class="shop-btn__title" id="titleDamage">Hit power</span>
        <span class="shop-btn__desc" id="descDamage">Lvl 1</span>
        <span class="shop-btn__cost" id="costDamage">$15</span>
      </button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
