<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KERNELFALL</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/symbol-small-editable.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand" aria-label="KERNELFALL"><img class="brand-symbol" src="assets/brand/symbol-small-editable.svg" alt=""><img class="brand-wordmark" src="assets/brand/wordmark-480.png" alt="KERNELFALL"></div>
      <div class="stats">
        <div class="stat stat--cash">
          <span class="stat-label" id="labelCash">Cash</span>
          <span class="stat-value" id="statCash">$0</span>
        </div>
        <div class="stat stat--level">
          <span class="stat-label" id="labelLevel">Sector</span>
          <span class="stat-value" id="statLevel">1</span>
        </div>
        <button class="icon-btn" id="btnMute" type="button" aria-label="Sound on" aria-pressed="false" title="Sound on">&#9834;</button>
      </div>
    </header>

    <main id="gameArea">
      <canvas id="gameCanvas"></canvas>
      <p id="hint" class="hint" hidden>Drones break the AI's defences · reach its core</p>
    </main>

    <footer id="shop">
      <button class="shop-btn" id="btnBuyBall" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="15" cy="12" r="4.5"/><circle cx="15" cy="12" r="1.6"/><path d="M2 9.5h6M3.5 12h5M2 14.5h6"/></svg>
        <span class="shop-btn__title" id="titleBuyBall">New drone</span>
        <span class="shop-btn__desc" id="descBuyBall">Drones: 1</span>
        <span class="shop-btn__cost" id="costBuyBall">$10</span>
      </button>

      <button class="shop-btn" id="btnFireRate" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12l4-6.9h8L20 12l-4 6.9H8z"/><path d="M13 7.5l-3.2 5h4.4L11 17"/></svg>
        <span class="shop-btn__title" id="titleFireRate">Override charge</span>
        <span class="shop-btn__desc" id="descFireRate">Lvl 1 · 11 s</span>
        <span class="shop-btn__cost" id="costFireRate">$15</span>
      </button>

      <button class="shop-btn" id="btnDamage" type="button">
        <svg class="shop-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/><path d="M12 9l3 3-3 3-3-3z"/></svg>
        <span class="shop-btn__title" id="titleDamage">Breach power</span>
        <span class="shop-btn__desc" id="descDamage">Lvl 1</span>
        <span class="shop-btn__cost" id="costDamage">$15</span>
      </button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
